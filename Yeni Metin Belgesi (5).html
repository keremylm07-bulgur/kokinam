<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kokina Pixel Adventure — Mobile Friendly</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1020;font-family:Inter,Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh}
.wrap{position:relative;width:100%;max-width:520px;background:#071025;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,0.6);overflow:hidden}
header{background:linear-gradient(90deg,#d62839,#ff7b8a);color:#fff;padding:12px;text-align:center;font-weight:700}
canvas{display:block;width:100%;background:#88d0ff;}
.controls{display:flex;justify-content:space-around;padding:12px;background:#071025;user-select:none;}
.btn{width:70px;height:70px;background:#ff7b8a;color:#fff;border:none;border-radius:50%;font-size:24px;font-weight:700;touch-action:none;}
.hint{color:#9fb8d6;text-align:center;padding:8px 12px;font-size:13px}
</style>
</head>
<body>

<div class="wrap">
  <header>KOKINA PIXEL ADVENTURE</header>
  <canvas id="c" width="960" height="960"></canvas>
  <div class="controls">
    <button class="btn" id="left">⟵</button>
    <button class="btn" id="jump">⭡</button>
    <button class="btn" id="right">⟶</button>
  </div>
  <div class="hint">Kızı kontrol et, erkeğe ulaş. Finalde mesaj çıkacak.</div>
</div>

<audio id="music" src="song.mp3" loop></audio>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const GAME = { width: 2700, height: 960, gravity: 0.65 };
let walkFrame = 0;

const runner = { x:50, y:0, w:32, h:48, vx:0, vy:0, speed:3.2, jump:13, onGround:false, prevY:0, walking:false };
const receiver = { x:2500, y:0, w:36, h:56, holding:true };

let camX = 0, finished = false, showSpeech = false, currentCheckpoint = 0;

const platforms = [
  {x:0,y:780,w:GAME.width,h:180},{x:200,y:660,w:180,h:20},{x:420,y:590,w:160,h:20},
  {x:620,y:520,w:140,h:20},{x:820,y:460,w:200,h:20},{x:1100,y:620,w:180,h:20},
  {x:1350,y:540,w:160,h:20},{x:1550,y:470,w:140,h:20},{x:1750,y:590,w:220,h:20},
  {x:1950,y:530,w:120,h:20}
];

const hazards = [
  {x:320,y:760,w:40,h:20},{x:900,y:740,w:60,h:40},
  {x:1480,y:760,w:40,h:20},{x:1680,y:740,w:60,h:40}
];

const checkpoints = [50,700,1200,1700];

const keys = { left:false, right:false, jump:false };

// Klavye kontrolleri
window.addEventListener("keydown", e=>{
  if(finished) return;
  if(e.key==="ArrowLeft"||e.key==="a") keys.left=true;
  if(e.key==="ArrowRight"||e.key==="d") keys.right=true;
  if(["ArrowUp"," ","w","W"].includes(e.key)) keys.jump=true;
});
window.addEventListener("keyup", e=>{
  if(e.key==="ArrowLeft"||e.key==="a") keys.left=false;
  if(e.key==="ArrowRight"||e.key==="d") keys.right=false;
  if(["ArrowUp"," ","w","W"].includes(e.key)) keys.jump=false;
});

// Mobil tuşlar
function setupTouchBtn(id,keyName){
  const btn = document.getElementById(id);
  btn.addEventListener("touchstart", e => { if(!finished) keys[keyName]=true; e.preventDefault(); });
  btn.addEventListener("touchend", e => { keys[keyName]=false; e.preventDefault(); });
  btn.addEventListener("mousedown", e => { if(!finished) keys[keyName]=true; });
  btn.addEventListener("mouseup", e => { keys[keyName]=false; });
}
setupTouchBtn("left","left");
setupTouchBtn("right","right");
setupTouchBtn("jump","jump");

// Başlangıç konumu
function placeOnGround(){
  runner.y = platforms[0].y - runner.h;
  receiver.y = platforms[0].y - receiver.h;
  camX = 0;
}
placeOnGround();

// Çizim fonksiyonları
function drawBackground(){ ctx.fillStyle="#7ec9ff"; ctx.fillRect(0,0,canvas.width,canvas.height); }

function drawPlatforms(){
  ctx.fillStyle="#5a3a1a";
  for(const p of platforms) ctx.fillRect(p.x-camX,p.y,p.w,p.h);
  ctx.fillStyle="#8b0000";
  for(const h of hazards) ctx.fillRect(h.x-camX,h.y,h.w,h.h);
}

function drawKokina(wx,wy){
  const x = Math.round(wx-camX), y = wy;
  ctx.fillStyle='#ff5370'; ctx.fillRect(x,y,6,6); ctx.fillRect(x+6,y+2,6,6); ctx.fillRect(x-2,y+6,6,6);
  ctx.fillStyle='#ffd166'; ctx.fillRect(x+3,y+3,4,4);
  ctx.fillStyle='#6aa84f'; ctx.fillRect(x+4,y+10,2,8);
}

function drawRunner(){
  const x=Math.round(runner.x-camX), y=Math.round(runner.y);
  
  // saç
  ctx.fillStyle="#5a3519"; 
  ctx.fillRect(x+2,y-6,28,10); 
  ctx.fillRect(x+0,y+2,6,28); 
  ctx.fillRect(x+26,y+2,6,28);

  // yüz
  ctx.fillStyle="#f1c27d"; 
  ctx.fillRect(x+8,y,16,14);

  // gözler
  ctx.fillStyle="#000"; 
  ctx.fillRect(x+10, y+4, 3,3); 
  ctx.fillRect(x+19, y+4, 3,3); 

  // elbise
  ctx.fillStyle="#ff9fc2"; 
  ctx.fillRect(x+2,y+14,28,18);

  const step = (walkFrame%20<10)?-3:3;
  const off = runner.walking?step:0;

  // bacaklar
  ctx.fillStyle="#4b3c3c"; 
  ctx.fillRect(x+6+off,y+32,8,18); 
  ctx.fillRect(x+18-off,y+32,8,18);

  ctx.fillStyle="#3b2a2a"; 
  ctx.fillRect(x+6+off,y+50,8,6); 
  ctx.fillRect(x+18-off,y+50,8,6);
}

function drawReceiver(){
  const x=Math.round(receiver.x-camX),y=Math.round(receiver.y);
  // saç
  ctx.fillStyle="#40210f"; ctx.fillRect(x+6,y-6,24,6);
  // kafa
  ctx.fillStyle="#f1c27d"; ctx.fillRect(x+6,y,24,12);
  // gözler
  ctx.fillStyle="#000"; ctx.fillRect(x+10,y+3,3,3); ctx.fillRect(x+17,y+3,3,3);
  ctx.fillStyle="#d62839"; ctx.fillRect(x+2,y+12,28,18);
  ctx.fillStyle="#111"; ctx.fillRect(x+8,y+30,18,18);
  ctx.fillStyle="#4b3c3c"; ctx.fillRect(x+8,y+48,8,6); ctx.fillRect(x+18,y+48,8,6);
  if(receiver.holding) drawKokina(receiver.x+22,receiver.y+8);
}

// Final konuşma
let speechTimer = 0;
const speechDuration = 3000;
const lines = ["8 Milyar İnsan Ama Sen...","En Tatlı Hatam Seni Seviyorum❤️","Bu Kokina Sana"];

function drawSpeech(){
  if(!showSpeech) return;
  const sx=Math.round((receiver.x-camX)+receiver.w/2),sy=Math.round(receiver.y-20);
  ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=2;
  const w=280,h=100;
  ctx.fillRect(sx-w/2,sy-h,w,h);
  ctx.strokeRect(sx-w/2,sy-h,w,h);
  ctx.fillStyle="#000"; ctx.font="16px Arial"; ctx.textAlign="center";

  let count = 0;
  const fullText = lines.join("\n");
  const totalChars = fullText.length;
  const charsToShow = Math.floor((speechTimer/speechDuration)*totalChars);
  for(let i=0;i<lines.length;i++){
    let lineText = lines[i];
    if(count+lineText.length>charsToShow) lineText=lineText.substring(0,charsToShow-count);
    ctx.fillText(lineText,sx,sy-h+30+i*20);
    count += lines[i].length;
  }
  if(speechTimer<speechDuration) speechTimer+=16;
}

// Fizik
function collidePlatforms(){
  runner.onGround = false;
  for(const p of platforms){
    const withinX = runner.x+runner.w>p.x && runner.x<p.x+p.w;
    const wasAbove = runner.prevY+runner.h <= p.y;
    const nowBelow = runner.y+runner.h >= p.y;
    if(withinX && wasAbove && nowBelow){
      runner.y = p.y - runner.h;
      runner.vy = 0;
      runner.onGround = true;
    }
  }
}

function checkHazards(){
  for(const h of hazards){
    if(runner.x+runner.w>h.x && runner.x<h.x+h.w && runner.y+runner.h>h.y){
      respawn();
    }
  }
}

function respawn(){
  runner.x = checkpoints[currentCheckpoint];
  runner.y = platforms[0].y - runner.h;
  runner.vx = runner.vy = 0;
  camX = Math.max(0, runner.x - canvas.width/2);
}

function updateCamera(){
  const target = runner.x - canvas.width/2 + runner.w/2;
  camX = Math.max(0, Math.min(GAME.width - canvas.width, target));
}

// Update loop
function update(){
  runner.prevY = runner.y;
  if(!finished){
    runner.vx = keys.left?-runner.speed:keys.right?runner.speed:0;
    runner.walking = runner.vx !== 0;
    if(keys.jump && runner.onGround){
      runner.vy = -runner.jump;
      runner.onGround = false;
    }
    runner.vy += GAME.gravity;
    runner.x += runner.vx;
    runner.y += runner.vy;
    collidePlatforms();
    checkHazards();
    walkFrame++;
    for(let i=0;i<checkpoints.length;i++) if(runner.x>checkpoints[i]) currentCheckpoint=i;
    if(runner.y>GAME.height+200) respawn();
    // Final flower
    const giveFlowerDistance = 20;
    if(runner.x+runner.w > receiver.x - giveFlowerDistance){
      finished = true;
      showSpeech = true;
      receiver.holding = false;
    }
  }
  updateCamera();
}

// Render loop
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground(); drawPlatforms(); drawReceiver(); drawRunner(); drawSpeech();
}

function loop(){ update(); render(); requestAnimationFrame(loop); }
loop();

// Müzik başlatma kullanıcı etkileşimiyle
const music = document.getElementById("music");
function startMusic() {
  music.play().catch(()=>console.log("Müzik oynatılamadı."));
  window.removeEventListener("touchstart", startMusic);
  window.removeEventListener("mousedown", startMusic);
}
window.addEventListener("touchstart", startMusic);
window.addEventListener("mousedown", startMusic);

</script>

</body>
</html>
